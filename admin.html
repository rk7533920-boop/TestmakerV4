<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Test Maker · Admin</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--muted:#6b7280;--border:#dfe2e8;--ink:#3b5bdb;--ink-text:#fff;--green:#1e8e3e;--red:#d93025;--warn:#b7791f;--bar:#c9d3f5;}
@media (prefers-color-scheme: dark){:root{--bg:#14171e;--card:#1e222b;--text:#eceef1;--muted:#9aa0a8;--border:#323844;--ink:#7aa2f7;--ink-text:#14171e;--green:#5fd07f;--red:#f28b82;--warn:#e0b341;--bar:#2b3c66;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(60px + env(safe-area-inset-bottom,0px));}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px 10px;z-index:10;}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;margin:0;color:var(--ink);}
h2{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;margin:0 0 8px;}
.sub{font-size:12px;color:var(--muted);}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:14px 0;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);}}
.stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.stat .n{font-size:24px;font-weight:700;line-height:1.15;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 12px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;}
button.primary{background:var(--ink);color:var(--ink-text);border-color:var(--ink);padding:10px 16px;font-size:14.5px;}
button.danger{color:var(--red);border-color:var(--red);}
button:disabled{opacity:.45;}
select,label{font-size:13px;}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px;}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
.chart .bar{width:100%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;}
.chart .c{font-size:10.5px;color:var(--muted);margin-bottom:2px;}
.chart .d{font-size:10px;color:var(--muted);margin-top:3px;}
.meter{height:10px;border-radius:6px;background:var(--bar);overflow:hidden;margin:8px 0 4px;}
.meter i{display:block;height:100%;background:var(--ink);}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;}
.hbar .nm{width:70px;color:var(--muted);}
.hbar .tr{flex:1;height:8px;background:var(--bar);border-radius:5px;overflow:hidden;}
.hbar .tr i{display:block;height:100%;background:var(--ink);}
.hbar .v{width:60px;text-align:right;}
.bug{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;}
.bug.done{opacity:.6;}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid var(--border);}
.k-parse-empty,.k-parse-crash,.k-pdf-error{color:var(--red);border-color:var(--red);}
.k-parse-incomplete{color:var(--warn);border-color:var(--warn);}
.k-pdf-no-text{color:var(--ink);border-color:var(--ink);}
.chip{display:inline-block;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;margin:8px 0 0;max-height:320px;overflow:auto;}
details summary{cursor:pointer;font-size:13px;color:var(--ink);margin-top:6px;}
.vrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);}
.vrow:last-child{border-bottom:0;}
.err{color:var(--red);font-size:13px;}
.note{font-size:12px;color:var(--muted);line-height:1.5;}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:14px 0;line-height:1.5;}
a{color:var(--ink);}
</style>
</head>
<body>
<header><div class="in"><div><h1>Test Maker · Admin</h1><div class="sub" id="who">Not signed in</div></div><div class="row" id="topBtns"></div></div></header>
<div class="wrap" id="app"><p class="sub" style="margin-top:20px;">Loading…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, collectionGroup, query, where, orderBy, limit, getDocs, getCountFromServer, doc, updateDoc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

/* ===== SET THIS: the Google account you sign in with. It must match the email inside firestore.rules. ===== */
const ADMIN_EMAIL = 'rk7533920@gmail.com';

const firebaseConfig = {
  apiKey: "AIzaSyBarq1AvclwJ-fm3FU4JSagohfWVk4MAXg",
  authDomain: "test-maker-50246.firebaseapp.com",
  projectId: "test-maker-50246",
  storageBucket: "test-maker-50246.firebasestorage.app",
  messagingSenderId: "1048658659017",
  appId: "1:1048658659017:web:9e521480b569f18692ef18"
};
/* A separately NAMED Firebase app: its sign-in is kept apart from the student app's anonymous sign-in, so opening this
   page never changes which student account the app uses on the same browser. */
const app = initializeApp(firebaseConfig, 'admin');
const auth = getAuth(app);
const db = getFirestore(app);
const FREE_BYTES = 1024 * 1024 * 1024;   // Firestore free plan: 1 GiB stored

const root = document.getElementById('app');
const whoEl = document.getElementById('who');
const topBtns = document.getElementById('topBtns');

/* ---------- tiny safe-DOM helpers (everything students send is shown as TEXT, never as HTML) ---------- */
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class') e.className = v; else if(k==='onclick') e.onclick = v; else if(k==='style') e.style.cssText = v; else if(k==='onchange') e.onchange = v; else e.setAttribute(k, v);
  }
  kids.flat().forEach(c=>{ if(c===null || c===undefined || c===false) return; e.append(c); });
  return e;
}
const fmt = n => (n===null || n===undefined) ? '—' : Number(n).toLocaleString();
function fmtBytes(b){ if(b===null) return '—'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function localDay(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ago(date){
  if(!date) return 'just now';
  const s = Math.max(0, (Date.now()-date.getTime())/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}
function stamp(date){ return date ? date.toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '—'; }
function device(ua){
  ua = ua||''; const os = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : /Android/i.test(ua) ? 'Android' : /Windows/i.test(ua) ? 'Windows' : /Mac OS/i.test(ua) ? 'Mac' : /Linux/i.test(ua) ? 'Linux' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /SamsungBrowser/i.test(ua) ? 'Samsung' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : '';
  return os+(br?' · '+br:'');
}

/* ---------- sign-in states ---------- */
const isAdmin = u => !!(u && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
function setTop(user){
  topBtns.replaceChildren();
  whoEl.textContent = user ? (user.email||'Signed in') : 'Not signed in';
  if(user) topBtns.append(el('button', {onclick: ()=>signOut(auth)}, 'Sign out'));
}
function showSignIn(msg){
  setTop(null);
  root.replaceChildren(el('div', {class:'card'},
    el('h2', {}, 'Admin sign-in'),
    el('p', {class:'note'}, 'Sign in with the admin Google account. Only that account can read the data, even if someone finds this page.'),
    ADMIN_EMAIL.startsWith('YOUR_ADMIN') ? el('div', {class:'banner'}, 'Setup needed: open admin.html in a text editor and set ADMIN_EMAIL to your Google email, and put the same email in firestore.rules.') : null,
    el('button', {class:'primary', onclick: async ()=>{ try{ await signInWithPopup(auth, new GoogleAuthProvider()); }catch(e){ showSignIn(friendlyAuthError(e)); } }}, 'Sign in with Google'),
    msg ? el('p', {class:'err', style:'margin-top:10px;'}, msg) : null
  ));
}
function friendlyAuthError(e){
  const c = e && e.code || '';
  if(c==='auth/unauthorized-domain') return 'This web address is not authorised. In Firebase console › Authentication › Settings › Authorized domains, add the domain this page is hosted on.';
  if(c==='auth/operation-not-allowed') return 'Google sign-in is not enabled. In Firebase console › Authentication › Sign-in method, enable Google.';
  if(c==='auth/popup-blocked') return 'The sign-in pop-up was blocked. Allow pop-ups for this site and try again.';
  if(c==='auth/popup-closed-by-user' || c==='auth/cancelled-popup-request') return 'Sign-in was cancelled.';
  if(location.protocol!=='https:' && location.protocol!=='http:') return 'Open this page from its web address (https://…), not from a downloaded file.';
  return 'Sign-in failed: '+(e && e.message || c);
}
function showDenied(user){
  setTop(user);
  root.replaceChildren(el('div', {class:'card'}, el('h2', {}, 'Not the admin account'), el('p', {class:'note'}, 'You are signed in as '+(user.email||'unknown')+', which is not the admin email set in this page. Sign out and use the admin account.')));
}

/* ---------- dashboard ---------- */
let reports = [];
let bugFilter = 'all', showResolved = false;
let busy = false;

function buildShell(){
  root.replaceChildren(
    el('div', {class:'row', style:'margin-top:14px;justify-content:space-between;'},
      el('span', {class:'sub', id:'updated'}, ''),
      el('button', {id:'refreshBtn', onclick: refresh}, '↻ Refresh')),
    el('div', {id:'banner'}),
    el('div', {id:'sec-overview'}), el('div', {id:'sec-activity'}), el('div', {id:'sec-db'}), el('div', {id:'sec-bugs'}), el('div', {id:'sec-visitors'}),
    el('p', {class:'note'}, 'Each refresh uses roughly 150–200 Firestore reads (the free plan allows 50,000 a day). Days are in your device\'s time zone.')
  );
}
const ok = r => r.status==='fulfilled' ? r.value : null;
const denied = rs => rs.some(r=>r.status==='rejected' && r.reason && (r.reason.code==='permission-denied'));

async function refresh(){
  if(busy) return; busy = true;
  const btn = document.getElementById('refreshBtn'); if(btn) btn.disabled = true;
  try{
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const cnt = async q => (await getCountFromServer(q)).data().count;
    const V = collection(db,'visitors'), D = collection(db,'dailyActive');
    const dayList = Array.from({length:14}, (_,i)=>localDay(new Date(now.getFullYear(), now.getMonth(), now.getDate()-(13-i))));
    const since = n => Timestamp.fromDate(new Date(now.getTime()-n*864e5));
    const jobs = [
      cnt(V),                                            // 0 total visitors
      cnt(query(V, where('lastSeen','>=',since(7)))),    // 1 seen in 7 days
      cnt(query(V, where('lastSeen','>=',since(30)))),   // 2 seen in 30 days
      cnt(query(V, where('firstSeen','>=',Timestamp.fromDate(startToday)))),   // 3 new today
      cnt(collectionGroup(db,'history')),                // 4 tests taken
      cnt(collectionGroup(db,'qbatches')),               // 5 question batches
      cnt(query(V, where('platform','==','android'))),   // 6
      cnt(query(V, where('platform','==','ios'))),       // 7
      cnt(query(V, where('platform','==','desktop'))),   // 8
      getDocs(query(collectionGroup(db,'qbatches'), limit(20))),   // 9 size sample
      getDocs(query(collectionGroup(db,'history'), limit(20))),    // 10 size sample
      getDocs(query(collection(db,'bugReports'), orderBy('createdAt','desc'), limit(100))),   // 11
      getDocs(query(V, orderBy('lastSeen','desc'), limit(30))),    // 12 recent visitors
      ...dayList.map(d=>cnt(query(D, where('day','==',d))))        // 13.. daily active per day
    ];
    const rs = await Promise.allSettled(jobs);
    const [total, w7, w30, newToday, tests, batches, android, ios, desktop] = rs.slice(0,9).map(ok);
    const dailyVals = rs.slice(13).map(ok);

    const b = document.getElementById('banner'); b.replaceChildren();
    if(denied(rs)) b.append(el('div', {class:'banner'}, 'Some data was refused (permission denied). Publish the latest firestore.rules in Firebase console › Firestore › Rules, and make sure the email in the rules matches ADMIN_EMAIL.'));
    else if(rs.some(r=>r.status==='rejected' && r.reason && /index/i.test(r.reason.message||''))) b.append(el('div', {class:'banner'}, 'Firestore needs an index for one query. Open the browser console (or the error link) and click the link Firebase gives to create it, then refresh.'));

    // Overview
    const stat = (n,l)=>el('div', {class:'stat'}, el('div', {class:'n'}, fmt(n)), el('div', {class:'l'}, l));
    document.getElementById('sec-overview').replaceChildren(el('div', {class:'card'}, el('h2', {}, 'Visitors'),
      el('div', {class:'grid'},
        stat(total,'Total visitors'), stat(dailyVals[13],'Active today'), stat(w7,'Active, last 7 days'),
        stat(w30,'Active, last 30 days'), stat(newToday,'New today'), stat(tests,'Tests taken (all)'))));

    // Activity chart + devices
    const max = Math.max(1, ...dailyVals.map(v=>v||0));
    const chart = el('div', {class:'chart'}, dayList.map((d,i)=>{
      const v = dailyVals[i];
      return el('div', {class:'col'}, el('div', {class:'c'}, v===null ? '' : String(v)), el('div', {class:'bar', style:'height:'+Math.round(((v||0)/max)*88)+'px;'}), el('div', {class:'d'}, d.slice(8)));
    }));
    const devTotal = Math.max(1, (android||0)+(ios||0)+(desktop||0));
    const hb = (name,v)=>el('div', {class:'hbar'}, el('span', {class:'nm'}, name), el('span', {class:'tr'}, el('i', {style:'width:'+Math.round(((v||0)/devTotal)*100)+'%;'})), el('span', {class:'v'}, fmt(v)));
    document.getElementById('sec-activity').replaceChildren(el('div', {class:'card'},
      el('h2', {}, 'Active students per day (last 14 days)'), chart,
      el('h2', {style:'margin-top:16px;'}, 'Devices'), hb('Android',android), hb('iPhone/iPad',ios), hb('Desktop',desktop)));

    // Database (estimated)
    const avgSize = snap => snap && snap.size ? snap.docs.reduce((a,d)=>a+JSON.stringify(d.data()).length, 0)/snap.size : null;
    const qSnap = ok(rs[9]), hSnap = ok(rs[10]);
    const qAvg = avgSize(qSnap), hAvg = avgSize(hSnap);
    const avgItems = qSnap && qSnap.size ? qSnap.docs.reduce((a,d)=>a+((d.data().items||[]).length),0)/qSnap.size : null;
    const estQ = (batches!==null && avgItems!==null) ? Math.round(batches*avgItems) : null;
    const estBytes = (batches!==null && qAvg!==null ? batches*(qAvg+120) : 0) + (tests!==null && hAvg!==null ? tests*(hAvg+120) : 0);
    const haveEst = (batches!==null && qAvg!==null) || (tests!==null && hAvg!==null);
    const pct = haveEst ? Math.min(100, estBytes/FREE_BYTES*100) : 0;
    document.getElementById('sec-db').replaceChildren(el('div', {class:'card'}, el('h2', {}, 'Database (estimated)'),
      el('div', {class:'grid'}, stat(batches,'Question batches'), stat(estQ,'≈ Questions stored'), stat(tests,'Saved test results')),
      el('div', {class:'meter'}, el('i', {style:'width:'+Math.max(pct>0?1:0,pct)+'%;'})),
      el('div', {}, haveEst ? '≈ '+fmtBytes(estBytes)+' of 1 GB free storage ('+pct.toFixed(2)+'%)' : 'Storage estimate unavailable'),
      el('p', {class:'note'}, 'Firestore does not report exact size to apps. This is an estimate from a sample of stored documents. For exact numbers, storage and read/write usage, open Firebase console › Firestore › Usage. '),
      el('a', {href:'https://console.firebase.google.com/project/'+firebaseConfig.projectId+'/firestore/usage', target:'_blank', rel:'noopener'}, 'Open Usage in Firebase console ↗')));

    // Bug reports
    const bSnap = ok(rs[11]);
    reports = bSnap ? bSnap.docs.map(d=>({id:d.id, ref:d.ref, ...d.data()})) : [];
    renderBugs(!bSnap);

    // Recent visitors
    const vSnap = ok(rs[12]);
    document.getElementById('sec-visitors').replaceChildren(el('div', {class:'card'}, el('h2', {}, 'Recent visitors'),
      !vSnap ? el('p', {class:'err'}, 'Could not load visitors.') :
      !vSnap.size ? el('p', {class:'note'}, 'No visitors recorded yet. They appear once students open the updated app.') :
      vSnap.docs.map(d=>{ const v = d.data(); const ls = v.lastSeen && v.lastSeen.toDate ? v.lastSeen.toDate() : null; const fs = v.firstSeen && v.firstSeen.toDate ? v.firstSeen.toDate() : null;
        return el('div', {class:'vrow'}, el('span', {}, '#'+d.id.slice(0,6)+' · '+(v.platform||'?')), el('span', {class:'sub'}, (v.sessions||0)+' visits · first '+stamp(fs)+' · last '+ago(ls))); })));

    document.getElementById('updated').textContent = 'Updated '+new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }catch(e){
    console.error(e);
    document.getElementById('banner').replaceChildren(el('div', {class:'banner'}, 'Could not load: '+(e && e.message || e)));
  }finally{ busy = false; if(btn) btn.disabled = false; }
}

function renderBugs(failed){
  const host = document.getElementById('sec-bugs'); if(!host) return;
  const open = reports.filter(r=>r.resolved!==true);
  const kinds = {}; open.forEach(r=>{ const k = r.kind || 'manual'; kinds[k] = (kinds[k]||0)+1; });
  const shown = reports.filter(r=>(showResolved || r.resolved!==true) && (bugFilter==='all' || (r.kind||'manual')===bugFilter));
  const sel = el('select', {onchange: e=>{ bugFilter = e.target.value; renderBugs(); }},
    el('option', {value:'all'}, 'All kinds'),
    [...new Set(reports.map(r=>r.kind||'manual'))].map(k=>{ const o = el('option', {value:k}, k); if(k===bugFilter) o.selected = true; return o; }));
  if(bugFilter==='all') sel.value = 'all';
  const chk = el('input', {type:'checkbox'}); chk.checked = showResolved; chk.onchange = ()=>{ showResolved = chk.checked; renderBugs(); };
  host.replaceChildren(el('div', {class:'card'},
    el('h2', {}, 'Bug reports ('+open.length+' open)'),
    el('div', {}, Object.entries(kinds).map(([k,n])=>el('span', {class:'badge k-'+k, style:'margin:0 6px 6px 0;'}, k+' · '+n))),
    el('div', {class:'row', style:'margin:8px 0;'}, sel, el('label', {class:'row', style:'gap:5px;'}, chk, 'Show resolved')),
    failed ? el('p', {class:'err'}, 'Could not load bug reports.') :
    !shown.length ? el('p', {class:'note'}, reports.length ? 'Nothing matches this filter.' : 'No reports yet. 🎉') :
    shown.map(bugCard),
    reports.length>=100 ? el('p', {class:'note'}, 'Showing the newest 100 reports.') : null));
}

function bugCard(r){
  const when = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
  const k = r.kind || 'manual';
  const chips = [['parsed',r.parsed],['markers',r.markers],['skipped',r.skipped],['missing',r.missing]].filter(x=>x[1]!==null && x[1]!==undefined).map(x=>el('span', {class:'chip'}, x[0]+' '+x[1]));
  const card = el('div', {class:'bug'+(r.resolved===true?' done':'')},
    el('div', {class:'row', style:'justify-content:space-between;'}, el('span', {class:'badge k-'+k}, k), el('span', {class:'sub'}, stamp(when)+' · '+ago(when))),
    el('div', {class:'sub', style:'margin-top:5px;'}, device(r.ua)+' · build '+(r.build||'?')+' · #'+String(r.uid||'').slice(0,6)),
    el('div', {}, chips),
    el('details', {}, el('summary', {}, 'Show report'), el('pre', {}, String(r.report||''))),
    el('div', {class:'row', style:'margin-top:8px;'},
      el('button', {onclick: async ev=>{ try{ await navigator.clipboard.writeText(String(r.report||'')); ev.target.textContent = 'Copied ✓'; }catch(e){ ev.target.textContent = 'Copy failed'; } }}, 'Copy'),
      el('button', {onclick: async ()=>{ try{ await updateDoc(r.ref, {resolved: r.resolved!==true}); r.resolved = r.resolved!==true; renderBugs(); }catch(e){ alert('Could not update: '+(e.message||e)); } }}, r.resolved===true ? 'Reopen' : 'Mark resolved'),
      el('button', {class:'danger', onclick: async ()=>{ if(!confirm('Delete this report permanently?')) return; try{ await deleteDoc(r.ref); reports = reports.filter(x=>x!==r); renderBugs(); }catch(e){ alert('Could not delete: '+(e.message||e)); } }}, 'Delete')));
  return card;
}

/* ---------- start ---------- */
onAuthStateChanged(auth, user=>{
  if(!user) return showSignIn();
  if(!isAdmin(user)) return showDenied(user);
  setTop(user); buildShell(); refresh();
});
</script>
</body>
</html>
